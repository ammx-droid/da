          renderAllocationRing(day);
          renderTodos();
          renderWorkoutTracker();
          renderBudget();
          updateCurrentSlot();
          if (scrollToNow) {
            scrollToCurrentSlot("auto");
          }
        };

        previousCalendarMonth.addEventListener("click", () => {
          calendarDate = new Date(
            calendarDate.getFullYear(),
            calendarDate.getMonth() - 1,
            1,
            12
          );
          renderWorkoutTracker();
        });

        nextCalendarMonth.addEventListener("click", () => {
          calendarDate = new Date(
            calendarDate.getFullYear(),
            calendarDate.getMonth() + 1,
            1,
            12
          );
          renderWorkoutTracker();
        });

        previousDayButton.addEventListener("click", () => {
          selectedDate.setDate(selectedDate.getDate() - 1);
          selectedDate = normalizeDate(selectedDate);
          renderSelectedDate();
        });

        nextDayButton.addEventListener("click", () => {
          selectedDate.setDate(selectedDate.getDate() + 1);
          selectedDate = normalizeDate(selectedDate);
          renderSelectedDate({ scrollToNow: isToday(selectedDate) });
        });

        todayButton.addEventListener("click", () => {
          selectedDate = new Date(actualToday);
          renderSelectedDate({ scrollToNow: true });
        });

        clearDayButton.addEventListener("click", () => {
          const label = new Intl.DateTimeFormat(undefined, {
            month: "long",
            day: "numeric",
            year: "numeric"
          }).format(selectedDate);
          const shouldClear = window.confirm(`Clear the agenda and to-do list for ${label}?`);
          if (!shouldClear) {
            return;
          }

          const dateKey = getDateKey(selectedDate);
          const latestState = loadAgenda();
          latestState[dateKey] = { todos: [], todosInitialized: true };
          state[dateKey] = latestState[dateKey];
          saveAgenda(latestState);
          buildSchedule();
          renderAllocationRing(state[dateKey]);
          renderTodos();
        });

        deadlineForm.addEventListener("submit", (event) => {
          event.preventDefault();
          const title = deadlineInput.value.trim();
          const dateKey = deadlineDate.value;

          if (!title) {
            deadlineInput.focus();
            return;
          }

          if (!/^\d{4}-\d{2}-\d{2}$/.test(dateKey)) {
            deadlineDate.focus();
            return;
          }

          const deadlines = Array.isArray(deadlineState[dateKey])
            ? deadlineState[dateKey]
            : [];
          deadlines.push(title);
          deadlineState[dateKey] = deadlines;
          deadlineInput.value = "";
          saveDeadlines();
          renderWorkoutTracker();
        });

        todoForm.addEventListener("submit", (event) => {
          event.preventDefault();
          if (!todoForm.classList.contains("is-open")) {
            todoForm.classList.add("is-open");
            todoFields.hidden = false;
            todoInput.focus();
            return;
          }

          const title = todoInput.value.trim();
          const details = todoDetailInput.value.trim();
          if (!title) {
            todoInput.focus();
            return;
          }

          const dateKey = getDateKey(selectedDate);
          const day = ensureDay(selectedDate, isToday(selectedDate));
          day.todos.push({
            title,
            details,
            completed: false,
            priority: "none"
          });
          closeTodoForm();
          saveTodos(dateKey);
          renderTodos();
        });

        budgetGoalInput.addEventListener("change", () => {
          const weekKey = getDateKey(getWeekStart(selectedDate));
          budgetState[weekKey] = normalizeBudgetWeek(budgetState[weekKey]);
          budgetState[weekKey].goal = Math.max(0, Number(budgetGoalInput.value) || 0);
          saveBudgetWeek(weekKey);
          renderBudget();
        });

        budgetAmountForm.addEventListener("submit", (event) => {
          event.preventDefault();
          const amount = Number(budgetAmountInput.value);

          if (!Number.isFinite(amount) || amount <= 0) {
            budgetAmountInput.focus();
            return;
          }

          const weekKey = getDateKey(getWeekStart(selectedDate));
          budgetState[weekKey] = normalizeBudgetWeek(budgetState[weekKey]);
          budgetState[weekKey].entries.push(amount);
          budgetAmountInput.value = "";
          saveBudgetWeek(weekKey);
          renderBudget();
        });

        budgetUndoButton.addEventListener("click", () => {
          const weekKey = getDateKey(getWeekStart(selectedDate));
          budgetState[weekKey] = normalizeBudgetWeek(budgetState[weekKey]);

          if (budgetState[weekKey].entries.length === 0) {
            return;
          }

          budgetState[weekKey].entries.pop();
          saveBudgetWeek(weekKey);
          renderBudget();
        });

        window.addEventListener("storage", (event) => {
          if (event.key === STORAGE_KEY) {
            const dateKey = getDateKey(selectedDate);
            const latestState = loadAgenda();
            const latestDay = latestState[dateKey] || { todos: [] };
            latestDay.todos = normalizeTodos(latestDay.todos);
            latestDay.tags =
              typeof latestDay.tags === "object" && latestDay.tags !== null
                ? latestDay.tags
                : {};
            latestDay.details =
              typeof latestDay.details === "object" && latestDay.details !== null
                ? latestDay.details
                : {};
            state[dateKey] = state[dateKey] || { todos: [], tags: {} };

            for (let slotIndex = 0; slotIndex < 48; slotIndex += 1) {
              const note = document.querySelector(`[data-slot="${slotIndex}"] .note`);
              const tagSelect = document.querySelector(
                `[data-slot="${slotIndex}"] .slot-tag`
              );
              const noteDetail = document.querySelector(
                `[data-slot="${slotIndex}"] .note-detail`
              );
              const detailToggle = document.querySelector(
                `[data-slot="${slotIndex}"] .note-detail-toggle`
              );
              const latestValue = latestDay[slotIndex] || "";
              const latestDetail = latestDay.details[slotIndex] || "";
              const savedTag = latestDay.tags[slotIndex] || "";
              const latestTag = TIME_TAGS.some((tag) => tag.value === savedTag)
                ? savedTag
                : "";
              if (note && document.activeElement !== note) {
                note.value = latestValue;
              }
              if (tagSelect && document.activeElement !== tagSelect) {
                tagSelect.value = latestTag;
                applyTagStyle(tagSelect, latestTag);
              }
              if (noteDetail && document.activeElement !== noteDetail) {
                noteDetail.value = latestDetail;
                noteDetail.hidden = !latestDetail;
                if (detailToggle) {
                  detailToggle.hidden = Boolean(latestDetail);
                }
              }
            }

            state[dateKey].tags = latestDay.tags;
            state[dateKey].details = latestDay.details;
            renderAllocationRing(state[dateKey]);

            if (
              JSON.stringify(state[dateKey]?.todos || []) !==
              JSON.stringify(latestDay.todos)
            ) {
              state[dateKey] = latestDay;
              renderTodos();
            }
          }

          if (event.key === WORKOUT_STORAGE_KEY) {
            renderWorkoutTracker();
          }

          if (event.key === DEADLINE_STORAGE_KEY) {
            renderWorkoutTracker();
          }

          if (event.key === BUDGET_STORAGE_KEY) {
            renderBudget();
          }
        });

        const checkForNewDay = () => {
          const currentDate = normalizeDate(new Date());
          if (getDateKey(currentDate) === getDateKey(actualToday)) {
            return;
          }

          const wasViewingToday = isToday(selectedDate);
          const selectedIsNewToday = getDateKey(selectedDate) === getDateKey(currentDate);
          actualToday = currentDate;
          ensureCurrentBudgetWeek();

          if (wasViewingToday || selectedIsNewToday) {
            selectedDate = new Date(actualToday);
            renderSelectedDate({ scrollToNow: true });
          } else {
            renderDateHeader();
            renderWorkoutTracker();
            renderBudget();
          }
        };

        ensureCurrentBudgetWeek();
        renderSelectedDate({ scrollToNow: true });
        window.setInterval(() => {
          checkForNewDay();
          rotateScheduleToCurrentTime();
          updateCurrentSlot();
        }, 60000);
      })();
    </script>
  </body>
</html>
